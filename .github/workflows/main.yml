name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Verificar arquivos sensiveis
      run: |
        tracked="$(git ls-files '.env' 'frontend/.env.local' '.env.local' 2>/dev/null || true)"
        if [ -n "$tracked" ]; then
          echo "ERRO: arquivo sensivel versionado:"
          echo "$tracked"
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Check Python Syntax
      run: |
        python -m py_compile backend/app.py
        python -m py_compile teste/teste_modelos.py
    - name: Run Pytest
      env:
        GEMINI_API_KEY: pytest-placeholder-not-used
      run: |
        pip install pytest
        pytest teste/teste_api_backend.py -q
